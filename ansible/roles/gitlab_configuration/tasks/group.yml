---
- name: Create or update the private Code Keeper group
  community.general.gitlab_group:
    api_url: "{{ gitlab_external_url }}"
    api_token: "{{ gitlab_api_token }}"
    name: "{{ gitlab_group_name }}"
    path: "{{ gitlab_group_path }}"
    visibility: private
    state: present
  register: gitlab_configuration_group
  when: gitlab_api_token | length > 0
  no_log: true
