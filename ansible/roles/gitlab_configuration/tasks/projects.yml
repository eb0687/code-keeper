---
- name: Create or update private Code Keeper projects
  community.general.gitlab_project:
    api_url: "{{ gitlab_external_url }}"
    api_token: "{{ gitlab_api_token }}"
    group: "{{ gitlab_group_path }}"
    name: "{{ item }}"
    path: "{{ item }}"
    visibility: private
    initialize_with_readme: false
    default_branch: main
    only_allow_merge_if_pipeline_succeeds: true
    state: present
  loop: "{{ gitlab_projects }}"
  when: gitlab_api_token | length > 0
  no_log: true
