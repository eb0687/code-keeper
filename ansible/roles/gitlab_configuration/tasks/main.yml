---
- name: Report GitLab API configuration is pending
  ansible.builtin.debug:
    msg: Add GITLAB_API_TOKEN or gitlab_api_token_vault, then provision again to configure GitLab policies and projects.
  when: gitlab_api_token | length == 0

- name: Configure GitLab authentication and visibility policies
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/application/settings"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      signup_enabled: false
      password_authentication_enabled_for_web: true
      password_authentication_enabled_for_git: true
      password_lowercase_required: true
      password_uppercase_required: true
      password_number_required: true
      password_symbol_required: true
      password_number_of_required_characters: 4
      minimum_password_length: "{{ gitlab_minimum_password_length }}"
      require_two_factor_authentication: "{{ gitlab_require_two_factor_authentication }}"
      default_project_visibility: private
      default_group_visibility: private
      default_snippet_visibility: private
    status_code: 200
  when: gitlab_api_token | length > 0
  no_log: true

- name: Look up the Code Keeper group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/{{ gitlab_group_path }}"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code:
      - 200
      - 404
  register: gitlab_configuration_group
  when: gitlab_api_token | length > 0
  no_log: true

- name: Create the private Code Keeper group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: "{{ gitlab_group_name }}"
      path: "{{ gitlab_group_path }}"
      visibility: private
    status_code: 201
  when:
    - gitlab_api_token | length > 0
    - gitlab_configuration_group.status == 404
  no_log: true

- name: Read the Code Keeper group ID
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/{{ gitlab_group_path }}"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  register: gitlab_configuration_group
  when: gitlab_api_token | length > 0
  no_log: true

- name: Look up Code Keeper projects
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ gitlab_group_path | urlencode }}%2F{{ item | urlencode }}"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code:
      - 200
      - 404
  loop: "{{ gitlab_projects }}"
  register: gitlab_configuration_project_lookup
  when: gitlab_api_token | length > 0
  no_log: true

- name: Create private Code Keeper projects
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      namespace_id: "{{ gitlab_configuration_group.json.id }}"
      name: "{{ item.item }}"
      path: "{{ item.item }}"
      visibility: private
      initialize_with_readme: "true"
      default_branch: main
    status_code: 201
  loop: "{{ gitlab_configuration_project_lookup.results }}"
  when:
    - gitlab_api_token | length > 0
    - item.status == 404
  no_log: true

- name: Read Code Keeper project IDs
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ gitlab_group_path | urlencode }}%2F{{ item | urlencode }}"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  loop: "{{ gitlab_projects }}"
  register: gitlab_configuration_projects_current
  when: gitlab_api_token | length > 0
  no_log: true

- name: Check main branch protection
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.json.id }}/protected_branches/main"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code:
      - 200
      - 404
  loop: "{{ gitlab_configuration_projects_current.results }}"
  register: gitlab_configuration_protected_branches
  when: gitlab_api_token | length > 0
  no_log: true

- name: Protect main branches
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.item.json.id }}/protected_branches"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: main
      push_access_level: 40
      merge_access_level: 40
      allow_force_push: "false"
    status_code: 201
  loop: "{{ gitlab_configuration_protected_branches.results }}"
  when:
    - gitlab_api_token | length > 0
    - item.status == 404
  no_log: true
