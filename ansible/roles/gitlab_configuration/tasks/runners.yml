---
- name: Create or update the protected deployment runner
  community.general.gitlab_runner:
    api_url: "{{ gitlab_external_url }}"
    api_token: "{{ gitlab_api_token }}"
    group: "{{ gitlab_configuration_group.group.id }}"
    description: "{{ gitlab_runner_name }}"
    state: present
    active: true
    tag_list:
      - "{{ gitlab_runner_tags }}"
    run_untagged: false
    locked: true
    access_level: ref_protected
    access_level_on_creation: true
  register: gitlab_configuration_deployment_runner
  when: gitlab_api_token | length > 0
  no_log: true

- name: Save the protected deployment runner credentials
  ansible.builtin.set_fact:
    gitlab_configuration_runner_token: >-
      {{ gitlab_configuration_deployment_runner.runner.token
      | default(gitlab_configuration_deployment_runner.runner.authentication_token, true)
      | default('', true) }}
    gitlab_configuration_deployment_runner_id: "{{ gitlab_configuration_deployment_runner.runner.id }}"
  when: gitlab_api_token | length > 0
  no_log: true

- name: Create or update the merge-request CI runner
  community.general.gitlab_runner:
    api_url: "{{ gitlab_external_url }}"
    api_token: "{{ gitlab_api_token }}"
    group: "{{ gitlab_configuration_group.group.id }}"
    description: "{{ gitlab_ci_runner_name }}"
    state: present
    active: true
    tag_list:
      - "{{ gitlab_ci_runner_tags }}"
    run_untagged: false
    locked: true
    access_level: not_protected
    access_level_on_creation: true
  register: gitlab_configuration_ci_runner
  when: gitlab_api_token | length > 0
  no_log: true

- name: Save the merge-request CI runner credentials
  ansible.builtin.set_fact:
    gitlab_configuration_ci_runner_token: >-
      {{ gitlab_configuration_ci_runner.runner.token
      | default(gitlab_configuration_ci_runner.runner.authentication_token, true)
      | default('', true) }}
    gitlab_configuration_ci_runner_id: "{{ gitlab_configuration_ci_runner.runner.id }}"
  when: gitlab_api_token | length > 0
  no_log: true
