---
- name: Check main branch protection
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.json.id }}/protected_branches/main"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code:
      - 200
      - 404
  loop: "{{ gitlab_configuration_projects_current.results }}"
  register: gitlab_configuration_protected_branches
  when: gitlab_api_token | length > 0
  no_log: true

- name: Protect main branches
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.item.json.id }}/protected_branches"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: main
      push_access_level: 40
      merge_access_level: 40
      allow_force_push: "false"
    status_code: 201
  loop: "{{ gitlab_configuration_protected_branches.results }}"
  when:
    - gitlab_api_token | length > 0
    - item.status == 404
  no_log: true

- name: Enforce merge requests and successful pipelines on main
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.json.id }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      only_allow_merge_if_pipeline_succeeds: true
    status_code: 200
  loop: "{{ gitlab_configuration_projects_current.results }}"
  when: gitlab_api_token | length > 0
  no_log: true

- name: Update existing main branch protection
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.item.json.id }}/protected_branches/main"
    method: PATCH
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      push_access_level: 0
      merge_access_level: 40
      allow_force_push: false
    status_code: 200
  loop: "{{ gitlab_configuration_protected_branches.results }}"
  when:
    - gitlab_api_token | length > 0
    - item.status == 200
  no_log: true

- name: Apply protected deployment runner attributes
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/runners/{{ gitlab_configuration_deployment_runner_id }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      tag_list:
        - "{{ gitlab_runner_tags }}"
      run_untagged: false
      locked: true
      access_level: ref_protected
    status_code: 200
  when:
    - gitlab_api_token | length > 0
    - gitlab_configuration_deployment_runner_id is defined
  no_log: true

- name: Apply merge-request CI runner attributes
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/runners/{{ gitlab_configuration_ci_runner_id }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      tag_list:
        - "{{ gitlab_ci_runner_tags }}"
      run_untagged: false
      locked: true
      access_level: not_protected
    status_code: 200
  when:
    - gitlab_api_token | length > 0
    - gitlab_configuration_ci_runner_id is defined
  no_log: true
