---
- name: Protect main branches
  community.general.gitlab_protected_branch:
    api_url: "{{ gitlab_external_url }}"
    api_token: "{{ gitlab_api_token }}"
    project: "{{ gitlab_group_path }}/{{ item }}"
    name: main
    push_access_level: nobody
    merge_access_levels: maintainer
    allow_force_push: false
    state: present
  loop: "{{ gitlab_projects }}"
  when: gitlab_api_token | length > 0
  no_log: true
